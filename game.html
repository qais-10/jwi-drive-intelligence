<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JWI Runner</title>
<style>
  :root {
    --black: #141414;
    --white: #FBFBFB;
    --beige: #EFEEEA;
    --font-display: "Miller Display", Georgia, "Times New Roman", serif;
    --font-body: "Maison Neue", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--black);
    overflow: hidden;
    font-family: var(--font-body);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--black);
  }
  canvas#game {
    display: block;
    background: var(--beige);
    touch-action: manipulation;
    filter: brightness(1);
    transition: filter 0.4s ease;
  }
  canvas#game.impact { filter: brightness(0.72); }
  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 22px;
    font-family: var(--font-body);
  }
  .hud-stat { pointer-events: none; text-align: left; }
  .hud-stat.right { text-align: right; }
  .hud-stat .label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--black);
    opacity: 0.55;
    font-weight: 300;
  }
  .hud-stat .value {
    display: block;
    font-size: 20px;
    font-weight: 500;
    color: var(--black);
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .iconbtn {
    pointer-events: auto;
    border: 1px solid var(--black);
    background: transparent;
    color: var(--black);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .iconbtn:hover { background: var(--black); color: var(--beige); }
  .iconbtn:active { transform: scale(0.92); }
  #powerupBar {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  .badge {
    background: var(--black);
    color: var(--beige);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }
  .badge.show { opacity: 1; transform: translateY(0); }
  #toast {
    position: absolute;
    top: 36%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 300;
    letter-spacing: 0.06em;
    font-size: clamp(18px, 4.6vw, 30px);
    color: var(--black);
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateY(8px);
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  .overlay-panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--black);
    color: var(--beige);
    text-align: center;
    padding: 32px;
    z-index: 10;
  }
  #overlay { opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #startOverlay.hide { display: none; }
  .brandmark {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--beige);
    opacity: 0.75;
  }
  .headline {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(38px, 10vw, 80px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.02;
    color: var(--beige);
  }
  .sub {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--beige);
    opacity: 0.7;
  }
  .legend {
    margin: 0;
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--beige);
    opacity: 0.45;
  }
  .stat-row { display: flex; gap: 30px; font-family: var(--font-body); }
  .stat-row .num {
    display: block;
    font-size: 22px;
    font-weight: 500;
    color: var(--beige);
    font-variant-numeric: tabular-nums;
  }
  .stat-row .cap {
    display: block;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-top: 4px;
  }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn-primary, .btn-secondary {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .btn-primary { background: var(--beige); color: var(--black); border: none; }
  .btn-primary:hover { background: var(--white); }
  .btn-primary:active { transform: scale(0.95); }
  .btn-secondary { background: transparent; color: var(--beige); border: 1px solid var(--beige); }
  .btn-secondary:hover { background: var(--beige); color: var(--black); }
  .btn-secondary:active { transform: scale(0.95); }
  button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  #titleRunner { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-stat">
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="hud-right">
      <div class="hud-stat right">
        <span class="label">Best</span>
        <span class="value" id="best">0</span>
      </div>
      <button id="shareBtnHud" class="iconbtn" type="button">Share</button>
    </div>
  </div>

  <div id="powerupBar">
    <div class="badge" id="shieldBadge">Shield</div>
    <div class="badge" id="multiplierBadge">Score x2</div>
    <div class="badge" id="doubleBadge">Double Jump</div>
  </div>
  <div id="toast"></div>

  <div id="overlay" class="overlay-panel">
    <div class="brandmark">JWI</div>
    <h1 class="headline">Game Over</h1>
    <div class="stat-row">
      <div><span class="num" id="finalScore">0</span><span class="cap">Distance</span></div>
      <div><span class="num" id="finalBest">0</span><span class="cap">High Score</span></div>
    </div>
    <div class="btn-row">
      <button id="restartBtn" class="btn-primary" type="button">Restart</button>
      <button id="shareBtnOver" class="btn-secondary" type="button">Share</button>
    </div>
  </div>

  <div id="startOverlay" class="overlay-panel">
    <div class="brandmark">JWI</div>
    <canvas id="titleRunner" width="96" height="96" aria-hidden="true"></canvas>
    <h1 class="headline">Runner</h1>
    <p class="sub">Tap Or Space To Jump &middot; Swipe Or Arrows To Switch Lanes</p>
    <p class="legend">Every 100m &middot; Shield &middot; 2&times; Score &middot; Double Jump</p>
    <div class="stat-row">
      <div><span class="num" id="startBest">0</span><span class="cap">High Score</span></div>
    </div>
    <div class="btn-row">
      <button id="shareBtnStart" class="btn-secondary" type="button">Share</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('game');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const startBestEl = document.getElementById('startBest');
  const overlay = document.getElementById('overlay');
  const startOverlay = document.getElementById('startOverlay');
  const restartBtn = document.getElementById('restartBtn');
  const shareBtnHud = document.getElementById('shareBtnHud');
  const shareBtnStart = document.getElementById('shareBtnStart');
  const shareBtnOver = document.getElementById('shareBtnOver');
  const badges = {
    shield: document.getElementById('shieldBadge'),
    multiplier: document.getElementById('multiplierBadge'),
    double: document.getElementById('doubleBadge'),
  };
  const toastEl = document.getElementById('toast');
  const titleRunnerCanvas = document.getElementById('titleRunner');

  if (typeof THREE === 'undefined') {
    wrap.textContent = 'Unable to load the 3D engine. Check your connection and reload.';
    return;
  }

  // ---------- constants ----------
  const LANES = [-2.2, 0, 2.2];
  const LANE_WIDTH = 2.0;
  const TILE_LENGTH = 12;
  const NUM_TILES = 14;
  const PLAYER_Z = 0;
  const CAMERA_Z = 7.4;
  const SPAWN_Z = -80;
  const DESPAWN_Z = 9;
  const COLLISION_Z = 0.6;

  const GRAVITY = 26;
  const JUMP_VELOCITY = 9.2;
  const MAX_JUMP_HEIGHT = (JUMP_VELOCITY * JUMP_VELOCITY) / (2 * GRAVITY);
  const BASE_SPEED = 9;
  const SPEED_RAMP_K = 1.6;
  const SPEED_CAP = 60;
  const DEATH_DURATION = 0.55;
  const MILESTONE_DISTANCE = 100;

  const POWERUP_TYPES = ['shield', 'multiplier', 'double'];
  const POWERUP_DURATION = { shield: 5, multiplier: 6, double: 8 };
  const POWERUP_LABEL = { shield: 'Shield', multiplier: 'Score x2', double: 'Double Jump' };
  const POWERUP_SPAWN_TOAST = {
    shield: 'Jump For Shield',
    multiplier: 'Jump For 2x Score',
    double: 'Jump For Double Jump',
  };
  const POWERUP_PICKUP_TOAST = {
    shield: 'Shield Acquired',
    multiplier: '2x Score Acquired',
    double: 'Double Jump Acquired',
  };

  // ---------- materials ----------
  const matBlack = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.88, metalness: 0.04 });
  const matBeige = new THREE.MeshStandardMaterial({ color: 0xEFEEEA, roughness: 0.7, metalness: 0.04 });
  const matDivider = new THREE.MeshBasicMaterial({ color: 0xEFEEEA });
  const matWire = new THREE.MeshBasicMaterial({ color: 0x141414, wireframe: true });

  // ---------- scene / camera / renderer ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xEFEEEA);
  scene.fog = new THREE.Fog(0xEFEEEA, 24, 92);

  const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 200);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const hemi = new THREE.HemisphereLight(0xFBFBFB, 0x141414, 0.55);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xFBFBFB, 0.75);
  sun.position.set(5, 11, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -7;
  sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 7;
  sun.shadow.camera.bottom = -7;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 26;
  sun.shadow.bias = -0.0015;
  scene.add(sun);

  function resize() {
    const w = Math.max(280, wrap.clientWidth);
    const h = Math.max(320, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- ground tiles ----------
  function makeTile(zStart) {
    const group = new THREE.Group();
    group.position.z = zStart;
    const laneMeshes = [];
    for (let i = 0; i < 3; i++) {
      const geo = new THREE.BoxGeometry(LANE_WIDTH, 0.4, TILE_LENGTH);
      const mesh = new THREE.Mesh(geo, matBlack);
      mesh.position.set(LANES[i], -0.2, 0);
      mesh.receiveShadow = true;
      group.add(mesh);
      laneMeshes.push(mesh);
    }
    const dGeo = new THREE.BoxGeometry(0.05, 0.02, TILE_LENGTH);
    const divL = new THREE.Mesh(dGeo, matDivider);
    divL.position.set(-1.1, 0.01, 0);
    const divR = new THREE.Mesh(dGeo, matDivider);
    divR.position.set(1.1, 0.01, 0);
    group.add(divL, divR);
    scene.add(group);
    return { group, laneMeshes, gapLanes: new Set() };
  }

  const tiles = [];
  for (let i = 0; i < NUM_TILES; i++) {
    tiles.push(makeTile(TILE_LENGTH - i * TILE_LENGTH));
  }

  function tileGapChance() { return Math.min(0.5, 0.14 + elapsed / 220); }
  function tileDoubleGapChance() { return Math.min(0.22, elapsed / 480); }

  function recycleTile(tile) {
    let minZ = Infinity;
    for (const t of tiles) minZ = Math.min(minZ, t.group.position.z);
    tile.group.position.z = minZ - TILE_LENGTH;
    tile.gapLanes.clear();
    if (elapsed > 3 && Math.random() < tileGapChance()) {
      const lanesShuffled = [0, 1, 2].sort(() => Math.random() - 0.5);
      tile.gapLanes.add(lanesShuffled[0]);
      if (Math.random() < tileDoubleGapChance()) tile.gapLanes.add(lanesShuffled[1]);
    }
    for (let i = 0; i < 3; i++) tile.laneMeshes[i].visible = !tile.gapLanes.has(i);
  }

  function tileAt(z) {
    for (const t of tiles) {
      const min = t.group.position.z - TILE_LENGTH / 2;
      const max = t.group.position.z + TILE_LENGTH / 2;
      if (z >= min && z < max) return t;
    }
    return null;
  }

  // ---------- runner rig (shared by player and title mascot) ----------
  function buildRunnerRig(scale) {
    scale = scale || 1;
    const rig = new THREE.Group();

    const legGeo = new THREE.BoxGeometry(0.16 * scale, 0.5 * scale, 0.16 * scale);
    const hipL = new THREE.Group();
    hipL.position.set(-0.13 * scale, 0.5 * scale, 0);
    const legL = new THREE.Mesh(legGeo, matBeige);
    legL.position.y = -0.25 * scale;
    legL.castShadow = true;
    hipL.add(legL);

    const hipR = new THREE.Group();
    hipR.position.set(0.13 * scale, 0.5 * scale, 0);
    const legR = new THREE.Mesh(legGeo, matBeige);
    legR.position.y = -0.25 * scale;
    legR.castShadow = true;
    hipR.add(legR);

    const armGeo = new THREE.BoxGeometry(0.12 * scale, 0.4 * scale, 0.12 * scale);
    const shoulder = new THREE.Group();
    shoulder.position.set(0.17 * scale, 0.95 * scale, 0);
    const arm = new THREE.Mesh(armGeo, matBeige);
    arm.position.y = -0.2 * scale;
    arm.castShadow = true;
    shoulder.add(arm);

    const torsoGeo = new THREE.BoxGeometry(0.42 * scale, 0.55 * scale, 0.28 * scale);
    const torso = new THREE.Mesh(torsoGeo, matBeige);
    torso.position.set(0, 0.78 * scale, 0);
    torso.castShadow = true;

    const headGeo = new THREE.SphereGeometry(0.18 * scale, 16, 16);
    const head = new THREE.Mesh(headGeo, matBeige);
    head.position.set(0.03 * scale, 1.18 * scale, 0);
    head.castShadow = true;

    const shieldAura = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.75 * scale, 1),
      new THREE.MeshBasicMaterial({ color: 0x141414, wireframe: true, transparent: true, opacity: 0.22 })
    );
    shieldAura.position.y = 0.7 * scale;
    shieldAura.visible = false;

    rig.add(hipL, hipR, shoulder, torso, head, shieldAura);
    return { rig, hipL, hipR, shoulder, shieldAura };
  }

  const playerRig = buildRunnerRig(1);
  scene.add(playerRig.rig);

  // ---------- player state ----------
  const player = {
    lane: 1,
    x: LANES[1],
    y: 0,
    vy: 0,
    onGround: true,
    extraJumpUsed: false,
    legPhase: 0,
  };

  let camX = LANES[1];

  let obstacles = [];
  let powerups = [];

  let speed = BASE_SPEED;
  let distance = 0;
  let elapsed = 0;
  let lastMilestone = 0;
  const effects = {
    shield: { active: false, timeLeft: 0 },
    multiplier: { active: false, timeLeft: 0 },
    double: { active: false, timeLeft: 0 },
  };

  let best = 0;
  try { best = parseInt(localStorage.getItem('jwiRunnerBest') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;
  startBestEl.textContent = best;

  let state = 'ready'; // ready | playing | dying | dead
  let lastTime = null;
  let nextObstacleAt = 0;
  let obstacleTimer = 0;
  let deathElapsed = 0;
  let deathStartSpeed = 0;
  let deathKnockVX = 0;
  let deathTiltDir = 1;

  function resetGame() {
    player.lane = 1;
    player.x = LANES[1];
    player.y = 0;
    player.vy = 0;
    player.onGround = true;
    player.extraJumpUsed = false;
    player.legPhase = 0;
    camX = LANES[1];
    playerRig.rig.rotation.set(-0.06, 0, 0);
    canvas.classList.remove('impact');

    for (const o of obstacles) scene.remove(o.mesh);
    for (const p of powerups) scene.remove(p.mesh);
    obstacles = [];
    powerups = [];

    for (let i = 0; i < tiles.length; i++) {
      tiles[i].group.position.z = TILE_LENGTH - i * TILE_LENGTH;
      tiles[i].gapLanes.clear();
      for (let j = 0; j < 3; j++) tiles[i].laneMeshes[j].visible = true;
    }

    speed = BASE_SPEED;
    distance = 0;
    elapsed = 0;
    obstacleTimer = 0;
    nextObstacleAt = 1.4;
    lastMilestone = 0;
    deathElapsed = 0;
    scoreEl.textContent = '0';

    for (const key of POWERUP_TYPES) {
      effects[key].active = false;
      effects[key].timeLeft = 0;
      badges[key].classList.remove('show');
    }
    playerRig.shieldAura.visible = false;
  }
  resetGame();

  function startGame() {
    resetGame();
    state = 'playing';
    startOverlay.classList.add('hide');
    overlay.classList.remove('show');
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function triggerDeath() {
    if (state !== 'playing') return;
    state = 'dying';
    deathElapsed = 0;
    deathStartSpeed = speed;
    deathKnockVX = -1.5;
    deathTiltDir = player.lane === 2 ? -1 : 1;
    player.vy = Math.max(player.vy, 3.4);
    canvas.classList.add('impact');
  }

  function endGame() {
    state = 'dead';
    const finalScore = Math.floor(distance);
    if (finalScore > best) {
      best = finalScore;
      try { localStorage.setItem('jwiRunnerBest', String(best)); } catch (e) {}
    }
    finalScoreEl.textContent = finalScore;
    finalBestEl.textContent = best;
    bestEl.textContent = best;
    overlay.classList.add('show');
  }

  function jump() {
    if (state === 'ready') { startGame(); return; }
    if (state !== 'playing') return;
    if (player.onGround) {
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      player.extraJumpUsed = false;
    } else if (effects.double.active && !player.extraJumpUsed) {
      player.vy = JUMP_VELOCITY * 0.85;
      player.extraJumpUsed = true;
    }
  }

  function laneMove(dir) {
    if (state !== 'playing') return;
    player.lane = Math.max(0, Math.min(2, player.lane + dir));
  }

  function showToast(text, duration) {
    duration = duration || 1400;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove('show'); }, duration);
  }

  async function shareLink() {
    const url = window.location.href;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
        showToast('Link Copied');
        return;
      }
      throw new Error('clipboard api unavailable');
    } catch (err) {
      try {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(ok ? 'Link Copied' : 'Copy Failed, Select Link Manually');
      } catch (err2) {
        showToast('Copy Failed, Select Link Manually');
      }
    }
  }

  // ---------- obstacle / powerup spawning ----------
  function spawnObstacle() {
    const type = Math.random() < 0.5 ? 'hurdle' : 'barrier';
    const lane = Math.floor(Math.random() * 3);
    let mesh, topY;
    if (type === 'hurdle') {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(LANE_WIDTH * 0.82, 0.6, 0.5), matBlack);
      mesh.position.set(LANES[lane], 0.3, SPAWN_Z);
      topY = 0.62;
    } else {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(LANE_WIDTH * 0.82, 3.0, 0.5), matBlack);
      mesh.position.set(LANES[lane], 1.5, SPAWN_Z);
      topY = 99;
    }
    mesh.castShadow = true;
    scene.add(mesh);
    obstacles.push({ mesh, lane, type, topY });
  }

  function spawnPowerup() {
    const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    const lane = Math.floor(Math.random() * 3);
    const y = MAX_JUMP_HEIGHT * (0.5 + Math.random() * 0.2);
    let geo;
    if (type === 'shield') geo = new THREE.IcosahedronGeometry(0.32, 0);
    else if (type === 'multiplier') geo = new THREE.OctahedronGeometry(0.34, 0);
    else geo = new THREE.TorusGeometry(0.26, 0.1, 8, 16);
    const mesh = new THREE.Mesh(geo, matBeige);
    mesh.castShadow = true;
    const wire = new THREE.Mesh(geo, matWire);
    wire.scale.setScalar(1.06);
    mesh.add(wire);
    mesh.position.set(LANES[lane], y, SPAWN_Z);
    scene.add(mesh);
    powerups.push({ mesh, lane, type, baseY: y, phase: Math.random() * Math.PI * 2 });
    showToast(POWERUP_SPAWN_TOAST[type]);
  }

  // ---------- update ----------
  function update(dt) {
    elapsed += dt;
    const targetSpeed = BASE_SPEED + SPEED_RAMP_K * Math.sqrt(elapsed);
    speed = Math.min(SPEED_CAP, targetSpeed);
    distance += speed * dt * (effects.multiplier.active ? 2 : 1);
    scoreEl.textContent = Math.floor(distance);

    // lane easing
    const targetX = LANES[player.lane];
    player.x += (targetX - player.x) * Math.min(1, dt * 9);

    // jump physics
    player.vy -= GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) {
      if (!player.onGround) player.onGround = true;
      player.y = 0;
      player.vy = 0;
      player.extraJumpUsed = false;
    } else {
      player.onGround = false;
    }
    if (player.onGround) player.legPhase += dt * (2.4 + speed * 0.12);

    // ground gap check
    const currentTile = tileAt(PLAYER_Z);
    const overGap = !!currentTile && currentTile.gapLanes.has(player.lane);
    if (overGap && player.onGround && player.y <= 0.02 && !effects.shield.active) {
      triggerDeath();
      return;
    }

    // effect timers
    for (const key of POWERUP_TYPES) {
      const e = effects[key];
      if (!e.active) continue;
      e.timeLeft -= dt;
      badges[key].textContent = POWERUP_LABEL[key] + ' ' + Math.max(0, Math.ceil(e.timeLeft)) + 's';
      if (e.timeLeft <= 0) {
        e.active = false;
        badges[key].classList.remove('show');
      }
    }
    playerRig.shieldAura.visible = effects.shield.active;
    if (effects.shield.active) {
      const pulse = 1 + Math.sin(elapsed * 8) * 0.06;
      playerRig.shieldAura.scale.setScalar(pulse);
    }

    // obstacle spawn timer
    obstacleTimer += dt;
    if (obstacleTimer >= nextObstacleAt) {
      spawnObstacle();
      obstacleTimer = 0;
      const difficulty = Math.max(0.42, 1 - elapsed / 140);
      nextObstacleAt = (0.9 + Math.random() * 0.9) * difficulty;
    }

    // powerup milestone
    const milestone = Math.floor(distance / MILESTONE_DISTANCE);
    if (milestone > lastMilestone && powerups.length === 0) {
      lastMilestone = milestone;
      spawnPowerup();
    }

    // move + recycle tiles
    for (const t of tiles) {
      t.group.position.z += speed * dt;
      if (t.group.position.z - TILE_LENGTH / 2 > DESPAWN_Z) recycleTile(t);
    }

    // move obstacles, check collision
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.mesh.position.z += speed * dt;
      if (o.mesh.position.z > DESPAWN_Z) {
        scene.remove(o.mesh);
        obstacles.splice(i, 1);
        continue;
      }
      if (!effects.shield.active && o.lane === player.lane &&
          Math.abs(o.mesh.position.z - PLAYER_Z) < COLLISION_Z && player.y < o.topY) {
        triggerDeath();
        return;
      }
    }

    // move powerups, check pickup
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.mesh.position.z += speed * dt;
      p.phase += dt * 3;
      p.mesh.position.y = p.baseY + Math.sin(p.phase) * 0.08;
      p.mesh.rotation.y += dt * 1.4;
      if (p.mesh.position.z > DESPAWN_Z) {
        scene.remove(p.mesh);
        powerups.splice(i, 1);
        continue;
      }
      if (p.lane === player.lane && Math.abs(p.mesh.position.z - PLAYER_Z) < COLLISION_Z &&
          Math.abs(player.y - p.baseY) < 0.55) {
        const type = p.type;
        effects[type].active = true;
        effects[type].timeLeft = POWERUP_DURATION[type];
        badges[type].classList.add('show');
        showToast(POWERUP_PICKUP_TOAST[type]);
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      }
    }
  }

  // ---------- render ----------
  function updateRig() {
    playerRig.rig.position.set(player.x, player.y, PLAYER_Z);
    const swing = player.onGround ? Math.sin(player.legPhase) * 0.85 : 0.7;
    if (player.onGround) {
      playerRig.hipL.rotation.x = swing;
      playerRig.hipR.rotation.x = -swing;
      playerRig.shoulder.rotation.x = -swing * 0.8;
      playerRig.rig.rotation.x = -0.06;
    } else {
      playerRig.hipL.rotation.x = -0.5;
      playerRig.hipR.rotation.x = 0.9;
      playerRig.shoulder.rotation.x = -0.8;
      playerRig.rig.rotation.x = -0.14;
    }
  }

  function updateCamera(dt, sx, sy) {
    camX += (player.x - camX) * Math.min(1, dt * 6);
    camera.position.set(camX + (sx || 0), 3.3 + player.y * 0.12 + (sy || 0), CAMERA_Z);
    camera.lookAt(camX * 0.4, 1.0 + player.y * 0.2, -9);
  }

  // eases the world to a stop and knocks the runner down, instead of an
  // abrupt freeze, so a collision reads as an impact rather than a glitch
  function updateDeath(dt) {
    deathElapsed += dt;
    const t = Math.min(1, deathElapsed / DEATH_DURATION);
    const ease = 1 - (1 - t) * (1 - t);
    const decaySpeed = deathStartSpeed * (1 - ease);

    for (const tl of tiles) tl.group.position.z += decaySpeed * dt;
    for (const o of obstacles) o.mesh.position.z += decaySpeed * dt;
    for (const p of powerups) p.mesh.position.z += decaySpeed * dt;

    player.vy -= GRAVITY * 0.55 * dt;
    player.y = Math.max(0, player.y + player.vy * dt);
    player.x += deathKnockVX * dt;
    deathKnockVX *= (1 - Math.min(1, dt * 3));

    playerRig.rig.position.set(player.x, player.y, PLAYER_Z);
    playerRig.rig.rotation.z = deathTiltDir * t * 0.8;
    playerRig.rig.rotation.x = -0.06 - t * 0.4;
    playerRig.hipL.rotation.x = -0.3;
    playerRig.hipR.rotation.x = 0.5;
    playerRig.shoulder.rotation.x = -0.5;

    const shakeEnvelope = Math.sin(Math.min(1, t) * Math.PI);
    const shakeMag = 0.2 * shakeEnvelope;
    const sx = Math.sin(deathElapsed * 26) * shakeMag;
    const sy = Math.cos(deathElapsed * 19) * shakeMag * 0.6;
    updateCamera(dt, sx, sy);

    if (t >= 1) endGame();
  }

  function loop(ts) {
    if (state !== 'playing' && state !== 'dying') return;
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.035);
    lastTime = ts;

    if (state === 'playing') {
      update(dt);
      updateRig();
      updateCamera(dt);
    } else if (state === 'dying') {
      updateDeath(dt);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  function renderIdleFrame() {
    updateRig();
    updateCamera(0);
    renderer.render(scene, camera);
  }
  renderIdleFrame();

  // ---------- title screen mascot (separate mini 3D scene) ----------
  const titleScene = new THREE.Scene();
  const titleCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 10);
  titleCamera.position.set(0, 1.05, 2.6);
  titleCamera.lookAt(0, 0.7, 0);
  const titleRenderer = new THREE.WebGLRenderer({ canvas: titleRunnerCanvas, antialias: true, alpha: true });
  titleRenderer.setClearColor(0x000000, 0);
  titleRenderer.setSize(96, 96, false);
  titleRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const titleHemi = new THREE.HemisphereLight(0xFBFBFB, 0x141414, 0.9);
  titleScene.add(titleHemi);
  const titleSun = new THREE.DirectionalLight(0xFBFBFB, 0.8);
  titleSun.position.set(2, 3, 3);
  titleScene.add(titleSun);
  const titleRig = buildRunnerRig(1);
  titleScene.add(titleRig.rig);

  let titlePhase = 0;
  let titleLastTs = null;
  function loopTitleRunner(ts) {
    if (titleLastTs === null) titleLastTs = ts;
    const dt = Math.min((ts - titleLastTs) / 1000, 0.05);
    titleLastTs = ts;
    titlePhase += dt * 7;
    const swing = Math.sin(titlePhase) * 0.85;
    titleRig.hipL.rotation.x = swing;
    titleRig.hipR.rotation.x = -swing;
    titleRig.shoulder.rotation.x = -swing * 0.8;
    titleRig.rig.rotation.x = -0.06;
    titleRig.rig.position.y = Math.abs(Math.sin(titlePhase * 2)) * 0.04;
    titleRenderer.render(titleScene, titleCamera);
    requestAnimationFrame(loopTitleRunner);
  }
  requestAnimationFrame(loopTitleRunner);

  // ---------- input ----------
  function handleKeydown(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); laneMove(-1); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); laneMove(1); }
  }
  window.addEventListener('keydown', handleKeydown);

  let touchStartX = 0, touchStartY = 0, touchActive = false;
  const SWIPE_THRESHOLD = 32;
  function onPointerDown(e) {
    touchActive = true;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
  }
  function onPointerUp(e) {
    if (!touchActive) return;
    touchActive = false;
    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;
    if (Math.abs(dy) > Math.abs(dx) && dy < -SWIPE_THRESHOLD) {
      jump();
    } else if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
      laneMove(dx > 0 ? 1 : -1);
    } else {
      jump();
    }
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointerup', onPointerUp);
  startOverlay.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    jump();
  });

  restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
  shareBtnHud.addEventListener('click', (e) => { e.stopPropagation(); shareLink(); });
  shareBtnStart.addEventListener('click', (e) => { e.stopPropagation(); shareLink(); });
  shareBtnOver.addEventListener('click', (e) => { e.stopPropagation(); shareLink(); });

  window.addEventListener('resize', () => { if (state !== 'playing' && state !== 'dying') renderIdleFrame(); });
})();
</script>
</body>
</html>
