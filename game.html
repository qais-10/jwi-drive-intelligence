<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Runner</title>
<style>
  :root {
    --bg-top: #1a1f3a;
    --bg-bottom: #0d1023;
    --ground: #2a2f52;
    --accent: #5eead4;
    --accent-2: #f472b6;
    --text: #e8e8f5;
    --obstacle: #f97362;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-bottom);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    max-width: 100vw;
    max-height: 100vh;
    touch-action: manipulation;
  }
  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hud .label { opacity: 0.55; margin-right: 6px; }
  #hud .value { font-weight: 700; color: var(--accent); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--text);
    background: rgba(13, 16, 35, 0.72);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    text-align: center;
    padding: 24px;
  }
  #overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  #overlay h1 {
    margin: 0;
    font-size: clamp(22px, 6vw, 34px);
    color: var(--accent-2);
    letter-spacing: 0.02em;
  }
  #overlay .stat {
    font-size: clamp(14px, 3.5vw, 17px);
    opacity: 0.85;
  }
  #overlay .stat b {
    color: var(--accent);
    font-weight: 700;
  }
  #restartBtn {
    margin-top: 8px;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #0d1023;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  #restartBtn:hover { background: #7ff2df; }
  #restartBtn:active { transform: scale(0.95); }
  #hint {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--text);
    opacity: 0.5;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
  }
  #startOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text);
    background: rgba(13, 16, 35, 0.55);
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  #startOverlay h1 {
    margin: 0 0 4px;
    font-size: clamp(24px, 7vw, 38px);
    color: var(--accent);
  }
  #startOverlay p {
    margin: 0;
    opacity: 0.75;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #startOverlay.hide { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div><span class="label">Best</span><span class="value" id="best">0</span></div>
  </div>
  <div id="hint">Tap or press space to jump</div>
  <div id="overlay">
    <h1>Game Over</h1>
    <div class="stat">Distance <b id="finalScore">0</b></div>
    <div class="stat">Best <b id="finalBest">0</b></div>
    <button id="restartBtn">Restart</button>
  </div>
  <div id="startOverlay">
    <h1>Endless Runner</h1>
    <p>Tap, click, or press space to start</p>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const overlay = document.getElementById('overlay');
  const startOverlay = document.getElementById('startOverlay');
  const restartBtn = document.getElementById('restartBtn');

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W, H, GROUND_Y;

  function resize() {
    const w = Math.min(window.innerWidth, 900);
    const h = Math.min(window.innerHeight, 520);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    W = w;
    H = h;
    GROUND_Y = H - Math.max(70, H * 0.18);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAVITY = 2600;
  const JUMP_VELOCITY = -900;
  const BASE_SPEED = 340;
  const MAX_SPEED = 820;
  const SPEED_RAMP = 6.5; // px/s^2 gained per second of play

  const player = {
    x: 0,
    y: 0,
    w: 34,
    h: 44,
    vy: 0,
    onGround: true,
    squash: 1,
  };

  let obstacles = [];
  let gaps = [];
  let particles = [];
  let clouds = [];

  let speed = BASE_SPEED;
  let distance = 0;
  let elapsed = 0;
  let best = 0;
  try {
    best = parseInt(localStorage.getItem('runnerBest') || '0', 10) || 0;
  } catch (e) { best = 0; }
  bestEl.textContent = best;

  let state = 'ready'; // ready | playing | dead
  let lastTime = null;
  let nextObstacleAt = 0;
  let obstacleTimer = 0;
  let groundOffset = 0;

  function resetGame() {
    player.x = W * 0.16;
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
    player.squash = 1;
    obstacles = [];
    gaps = [];
    particles = [];
    speed = BASE_SPEED;
    distance = 0;
    elapsed = 0;
    obstacleTimer = 0;
    nextObstacleAt = 1.1;
    scoreEl.textContent = '0';
    initClouds();
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 20 + Math.random() * (H * 0.35),
        r: 14 + Math.random() * 18,
        speedMul: 0.25 + Math.random() * 0.3,
      });
    }
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startOverlay.classList.add('hide');
    overlay.classList.remove('show');
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'dead';
    const finalScore = Math.floor(distance);
    if (finalScore > best) {
      best = finalScore;
      try { localStorage.setItem('runnerBest', String(best)); } catch (e) {}
    }
    finalScoreEl.textContent = finalScore;
    finalBestEl.textContent = best;
    bestEl.textContent = best;
    overlay.classList.add('show');
  }

  function jump() {
    if (state === 'ready') {
      startGame();
      return;
    }
    if (state === 'dead') return;
    if (player.onGround) {
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      player.squash = 1;
      spawnDust();
    }
  }

  function spawnDust() {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: player.x + player.w / 2,
        y: GROUND_Y,
        vx: (Math.random() - 0.5) * 120,
        vy: -Math.random() * 80,
        life: 0.4 + Math.random() * 0.2,
        age: 0,
      });
    }
  }

  function spawnObstacle() {
    const r = Math.random();
    if (r < 0.35) {
      // gap in the ground
      const gw = 60 + Math.random() * 40 + Math.min(speed - BASE_SPEED, 240) * 0.15;
      gaps.push({ x: W + 20, w: gw });
    } else if (r < 0.7) {
      // low obstacle - jump over
      const h = 32 + Math.random() * 20;
      obstacles.push({ x: W + 20, y: GROUND_Y - h, w: 26, h, type: 'block' });
    } else {
      // taller obstacle
      const h = 54 + Math.random() * 18;
      obstacles.push({ x: W + 20, y: GROUND_Y - h, w: 30, h, type: 'spike' });
    }
  }

  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function update(dt) {
    elapsed += dt;
    speed = Math.min(MAX_SPEED, BASE_SPEED + elapsed * SPEED_RAMP);
    distance += speed * dt * 0.05;
    scoreEl.textContent = Math.floor(distance);

    groundOffset = (groundOffset + speed * dt) % 40;

    // physics
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    let overGap = false;
    for (const g of gaps) {
      if (player.x + player.w * 0.25 > g.x && player.x + player.w * 0.75 < g.x + g.w) {
        overGap = true;
      }
    }

    const floorY = GROUND_Y - player.h;
    if (!overGap && player.y >= floorY) {
      if (!player.onGround) {
        player.squash = 1.25;
      }
      player.y = floorY;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }

    player.squash += (1 - player.squash) * Math.min(1, dt * 10);

    if (overGap && player.y >= floorY) {
      endGame();
      return;
    }
    if (player.y > H + 100) {
      endGame();
      return;
    }

    // spawn obstacles
    obstacleTimer += dt;
    if (obstacleTimer >= nextObstacleAt) {
      spawnObstacle();
      obstacleTimer = 0;
      const difficulty = Math.max(0.45, 1 - elapsed / 90);
      nextObstacleAt = (0.9 + Math.random() * 0.9) * difficulty;
    }

    for (const o of obstacles) o.x -= speed * dt;
    for (const g of gaps) g.x -= speed * dt;
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    gaps = gaps.filter(g => g.x + g.w > -20);

    for (const o of obstacles) {
      const px = player.x + 4;
      const pw = player.w - 8;
      const py = player.y + 4;
      const ph = player.h - 6;
      if (rectsOverlap(px, py, pw, ph, o.x, o.y, o.w, o.h)) {
        endGame();
        return;
      }
    }

    for (const c of clouds) {
      c.x -= speed * dt * c.speedMul * 0.3;
      if (c.x < -40) {
        c.x = W + 40;
        c.y = 20 + Math.random() * (H * 0.35);
      }
    }

    for (const p of particles) {
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
    }
    particles = particles.filter(p => p.age < p.life);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // clouds
    ctx.fillStyle = 'rgba(232,232,245,0.12)';
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ground line with gaps
    ctx.strokeStyle = '#3a4270';
    ctx.lineWidth = 2;

    const groundSegments = [];
    let cursor = 0;
    const sortedGaps = [...gaps].sort((a, b) => a.x - b.x);
    for (const g of sortedGaps) {
      groundSegments.push([cursor, g.x]);
      cursor = g.x + g.w;
    }
    groundSegments.push([cursor, W]);

    ctx.fillStyle = '#20264a';
    for (const [gx0, gx1] of groundSegments) {
      if (gx1 <= gx0) continue;
      ctx.fillRect(gx0, GROUND_Y, gx1 - gx0, H - GROUND_Y);
    }
    ctx.beginPath();
    for (const [gx0, gx1] of groundSegments) {
      if (gx1 <= gx0) continue;
      ctx.moveTo(gx0, GROUND_Y);
      ctx.lineTo(gx1, GROUND_Y);
    }
    ctx.stroke();

    // gap warning glow
    ctx.fillStyle = 'rgba(249,115,98,0.15)';
    for (const g of gaps) {
      ctx.fillRect(g.x, GROUND_Y, g.w, H - GROUND_Y);
    }

    // tick marks for motion feel
    ctx.strokeStyle = 'rgba(94,234,212,0.15)';
    ctx.lineWidth = 1;
    for (const [gx0, gx1] of groundSegments) {
      for (let x = gx0 - (groundOffset % 40); x < gx1; x += 40) {
        if (x < gx0) continue;
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y + 6);
        ctx.lineTo(x, GROUND_Y + 12);
        ctx.stroke();
      }
    }

    // obstacles
    for (const o of obstacles) {
      if (o.type === 'spike') {
        ctx.fillStyle = '#f97362';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#f472b6';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(o.x, o.y, o.w, 5);
      }
    }

    // particles
    for (const p of particles) {
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = `rgba(150,160,200,${alpha * 0.6})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // player
    ctx.save();
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h;
    ctx.translate(cx, cy);
    ctx.scale(1 / player.squash, player.squash);
    ctx.translate(-cx, -cy);
    const grad = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.h);
    grad.addColorStop(0, '#5eead4');
    grad.addColorStop(1, '#2dd4bf');
    ctx.fillStyle = grad;
    roundRect(ctx, player.x, player.y, player.w, player.h, 8);
    ctx.fill();
    // eye
    ctx.fillStyle = '#0d1023';
    ctx.beginPath();
    ctx.arc(player.x + player.w * 0.72, player.y + player.h * 0.28, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function loop(ts) {
    if (state !== 'playing') return;
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.035);
    lastTime = ts;
    update(dt);
    draw();
    if (state === 'playing') requestAnimationFrame(loop);
    else draw();
  }

  // draw an idle preview frame before start
  function drawIdle() {
    resetGame();
    draw();
  }
  drawIdle();

  function handleInput(e) {
    if (e.type === 'keydown') {
      if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
      e.preventDefault();
    }
    jump();
  }

  window.addEventListener('keydown', handleInput);
  canvas.addEventListener('pointerdown', jump);
  startOverlay.addEventListener('pointerdown', (e) => { e.stopPropagation(); jump(); });
  restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });

  window.addEventListener('resize', () => {
    if (state !== 'playing') drawIdle();
  });
})();
</script>
</body>
</html>
